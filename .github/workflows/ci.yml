name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A new push to a PR cancels that PR's previous run; runs on master always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true
  # `apps/web/.env.schema` marks PAYLOAD_SECRET required, and varlock exits without it.
  # Nothing here talks to a real database or deploys, so a throwaway value is enough.
  PAYLOAD_SECRET: ci-only-not-a-real-secret
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm's version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Each turbo task builds the plugin first (`dependsOn: ["^build"]`).
      - run: pnpm lint
      - run: pnpm typecheck

      - name: Plugin unit tests
        run: pnpm --filter @shipment/payload-seo-analyzer test

      # Unit tests plus a Payload boot on in-memory SQLite, against source.
      - name: Socials plugin tests
        run: pnpm --filter @shipment/payload-plugin-socials test

      # Unit tests plus Payload 4 integration tests on in-memory SQLite, against source.
      - name: A/B testing plugin tests
        run: pnpm --filter @shipment/payload-plugin-ab test

      # Option validation plus a Payload boot next to plugin-mcp (in-memory SQLite), against source.
      - name: Assistant plugin tests
        run: pnpm --filter @shipment/payload-plugin-assistant test

      # Unit, component and Payload integration tests (in-memory SQLite), against source.
      - name: On-page editor tests
        run: pnpm --filter @shipment/onpage test

      # Runs against a fresh local D1 (wrangler's platform proxy), built from the committed
      # migrations: Payload doesn't push the schema (`push: false`).
      - name: App integration tests
        run: |
          pnpm web migrate
          pnpm web test:int

      - name: Production build (plugin + Worker)
        run: pnpm build

      # Schema changes need a committed migration, and admin components / config changes need
      # the regenerated import map and types (see AGENTS.md).
      - name: Generated files and migrations are up to date
        run: |
          pnpm web generate:importmap
          pnpm web generate:types
          # Writes a migration only when the schema differs from the last migration's snapshot.
          # (Not `--force-accept-warning`: that writes a blank migration even when nothing changed.)
          pnpm web migrate:create ci-drift-check --skip-empty
          if [ -n "$(git status --porcelain --untracked-files=all -- apps/web/src/db/migrations)" ]; then
            echo "::error::The Payload schema changed without a migration. Run \`pnpm web migrate:create <name>\` and commit it."
            git status --short -- apps/web/src/db/migrations
            exit 1
          fi
          # Wrangler writes a random temp path into the header comment of cloudflare-env.d.ts.
          if ! git diff --exit-code -I '^// Generated by Wrangler by running' -- apps/web; then
            echo "::error::Generated files are stale. Run \`pnpm web generate:importmap\` and \`pnpm web generate:types\`, then commit the result."
            exit 1
          fi

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The app imports the plugins' dist (the SEO analyzer and packages/onpage/*).
      - name: Build the workspace plugins
        run: pnpm turbo run build --filter='./packages/**'

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @shipment/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @shipment/web exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @shipment/web exec playwright install-deps chromium

      # Build the local D1s from the committed migrations, as a deploy would (the dev server
      # doesn't push the schema). A migration that doesn't apply fails here.
      - name: Migrate the local D1 databases
        run: |
          pnpm web migrate
          pnpm web seo-store:migrate

      # Starts `vite dev` itself (playwright.config.ts) on a fresh local D1.
      - name: Playwright
        run: pnpm web test:e2e
        env:
          # Enables the Socials plugin so its admin is functional (without a key it shows a
          # notice, which socials.e2e.spec.ts also handles). Not a real key (32 bytes as hex).
          SOCIALS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
