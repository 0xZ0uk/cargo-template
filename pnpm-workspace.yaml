packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  # Versions shared by apps/web and packages/*. Payload's packages must move in lockstep,
  # and payload / @payloadcms/ui must resolve to ONE copy (pnpm keys them by their
  # react and typescript peers), so these live here and every package uses `catalog:`.
  '@payloadcms/db-d1-sqlite': 4.0.0-beta.6
  '@payloadcms/graphql': 4.0.0-beta.6
  '@payloadcms/live-preview-react': 4.0.0-beta.6
  '@payloadcms/plugin-mcp': 4.0.0-beta.6
  '@payloadcms/plugin-seo': 4.0.0-beta.6
  '@payloadcms/richtext-lexical': 4.0.0-beta.6
  '@payloadcms/storage-r2': 4.0.0-beta.6
  '@payloadcms/tanstack-start': 4.0.0-beta.6
  '@payloadcms/ui': 4.0.0-beta.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  'payload': 4.0.0-beta.6
  'react': 19.3.1
  'react-dom': 19.3.1
  'typescript': 6.0.3

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@payloadcms/db-d1-sqlite@4.0.0-beta.6'
  - '@payloadcms/drizzle@4.0.0-beta.6'
  - '@payloadcms/graphql@4.0.0-beta.6'
  - '@payloadcms/plugin-mcp@4.0.0-beta.6'
  - '@payloadcms/richtext-lexical@4.0.0-beta.6'
  - '@payloadcms/tanstack-start@4.0.0-beta.6'
  - '@payloadcms/translations@4.0.0-beta.6'
  - '@payloadcms/ui@4.0.0-beta.6'
  - payload@4.0.0-beta.6
  - '@payloadcms/plugin-cloud-storage@4.0.0-beta.6'
  - '@payloadcms/storage-r2@4.0.0-beta.6'
  - '@payloadcms/storage-s3@4.0.0-beta.6'
  - miniflare@5.20261023.3-beta
  - wrangler@4.156.0
  - '@payloadcms/plugin-seo@4.0.0-beta.6'
  - '@payloadcms/live-preview@4.0.0-beta.6'
  - '@payloadcms/live-preview-react@4.0.0-beta.6'
